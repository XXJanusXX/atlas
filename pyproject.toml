[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trading"
version = "0.1.0"
description = "AI-assisted quantitative Forex research and paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.2", "numpy>=1.26", "pandas>=2.2", "duckdb>=1.0", "httpx>=0.27", "PyYAML>=6.0", "typer>=0.12", "tzdata>=2024.1"]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
analytics = ["quantstats>=0.0.62", "vectorbt>=0.26"]
indicators = ["TA-Lib>=0.4.32"]

[project.scripts]
atlas = "atlas.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
